name: 'Processor Check'
run-name: "Processor Check ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - main
    paths:
      - 'rtl/**'
      - 'sw/**'
      - 'sim/**'
      - '.github/workflows/Processor.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'sw/**'
      - 'sim/**'
      - '.github/workflows/Processor.yml'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:

  sim_default_tb:
    runs-on: ubuntu-latest
    name: 'processor simulation'
    strategy:
      fail-fast: false
      matrix:
        example:
          - processor_check
          - hello_world

    steps:

    - name: '🧰 Repository Checkout'
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      continue-on-error: true
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
    - name: '📦 Install xPack RISC-V GCC'
      run: |
        wget -q https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz
        mkdir $GITHUB_WORKSPACE/riscv-gcc
        tar -xzf xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz -C $GITHUB_WORKSPACE/riscv-gcc
        echo "$GITHUB_WORKSPACE/riscv-gcc/xpack-riscv-none-elf-gcc-15.2.0-1/bin" >> $GITHUB_PATH

    - name: '📦 Install GHDL'
      uses: ghdl/setup-ghdl@v1
      with:
        version: nightly
        backend: mcode

    - name: '🔍 Check tools'
      run: |
        riscv-none-elf-gcc -v
        ghdl -v

    - name: '⚙️ Build software framework tests'
      run: |
        make RISCV_PREFIX=riscv-none-elf- -C sw/example/processor_check check
        make RISCV_PREFIX=riscv-none-elf- -C sw/example clean_all exe
        make RISCV_PREFIX=riscv-none-elf- -C sw/bootloader clean_all info bootloader

    - name: '🚧 Compile executable and run simulation'
      run: |
        make -C sw/example/${{ matrix.example }} \
        RISCV_PREFIX=riscv-none-elf- \
        USER_FLAGS+="-DUART0_SIM_MODE -DUART1_SIM_MODE" \
        clean_all \
        info \
        all \
        sim-check
